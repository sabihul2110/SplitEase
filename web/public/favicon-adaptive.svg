<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Default Light Mode Colors */
    .slice-dark { fill: #2563eb; }
    .slice-light { fill: #3b82f6; }
    .ring { stroke: #2563eb; }
    .cross-line { stroke: #13141c; }

    /* Dark Mode Colors (Brightened to pass Safari's contrast check) */
    @media (prefers-color-scheme: dark) {
      .slice-dark { fill: #60a5fa; }
      .slice-light { fill: #93c5fd; }
      .ring { stroke: #93c5fd; }
      .cross-line { stroke: #ffffff; }
    }
  </style>

  <!-- Central geometric splitting design (Transparent background) -->
  <g transform="translate(256, 256) scale(1.5)">
    <path class="slice-dark" d="M -45 -45 L -85 -85 A 120 120 0 0 1 0 -120 L 0 -60 A 60 60 0 0 0 -42.4 -42.4 Z"/>
    <path class="slice-light" d="M 45 -45 L 85 -85 A 120 120 0 0 0 120 0 L 60 0 A 60 60 0 0 1 42.4 -42.4 Z"/>
    <path class="slice-dark" d="M 45 45 L 85 85 A 120 120 0 0 1 0 120 L 0 60 A 60 60 0 0 0 42.4 42.4 Z"/>
    <path class="slice-light" d="M -45 45 L -85 85 A 120 120 0 0 0 -120 0 L -60 0 A 60 60 0 0 1 -42.4 42.4 Z"/>
    
    <circle cx="0" cy="0" r="25" class="ring" fill="none" stroke-width="3" opacity="0.4"/>
    
    <line x1="-35" y1="-35" x2="35" y2="35" class="cross-line" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="-35" x2="-35" y2="35" class="cross-line" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>